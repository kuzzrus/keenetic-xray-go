name: georanges-update

# Rebuilds internal/georanges/data/ru-ipv4.txt from the RIR delegated-
# statistics files and iptoasn.com's prefix-to-ASN map (see
# cmd/georanges-gen) and commits it straight to main.
#
# Daily, not weekly as it was while the RIR files were the only source.
# That old cadence rested on delegations changing far more slowly than
# the domain/CDN lists geo-update.yml refreshes, which is still true of
# the registry layer -- but the ASN layer tracks which prefixes Russian
# networks actually originate, upstream rebuilds it hourly, and a weekly
# pull would make this workflow the slowest hop in a chain that is
# otherwise hourly upstream and daily on the router.
#
# No "high churn -> open a PR instead" branch like geo-update.yml has:
# that guard exists there because a preset source changing format can
# silently produce garbage lists. cmd/georanges-gen refuses to write a
# suspiciously short list on its own (minRanges) or a suspiciously thin
# one (minAddresses, the guard that matters now that entries are
# coalesced and a few huge bogus blocks could hold the line count up),
# and it fails outright rather than quietly shipping the registry layer
# alone if the ASN source is unreachable. Day-to-day churn here is RIR
# reassignments plus ordinary BGP movement, a small fraction of ~10.5k
# merged entries every run.

on:
  schedule:
    - cron: '43 6 * * *' # daily, 06:43 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: georanges-update
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Regenerate the Russian IPv4 range list
        run: go run ./cmd/georanges-gen

      - name: Commit if changed
        run: |
          set -eu
          path=internal/georanges/data/ru-ipv4.txt

          if [ -z "$(git status --porcelain "$path")" ]; then
            echo "unchanged - nothing to do"
            exit 0
          fi

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$path"
          git commit -m "chore(georanges): refresh $(date -u +%Y-%m-%d)" -m "[skip ci]"
          # A same-day manual run can race the scheduled push; rebase once.
          git push || { git pull --rebase origin main && git push; }
