name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: gofmt
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "gofmt needs to be run on:"
            echo "$fmt_out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2025.1.1
          staticcheck ./...

      - name: go test
        run: go test -race ./...

      - name: shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck -s sh -S warning \
            install.sh \
            packaging/build-ipk.sh \
            packaging/ipk/postinst \
            packaging/ipk/prerm \
            packaging/init.d/S99keenetic-xray

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goarch: arm64
            gomips: ""
            qemu: qemu-aarch64-static
          - goarch: mipsle
            gomips: softfloat
            qemu: qemu-mipsel-static
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Cross-compile
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOMIPS: ${{ matrix.gomips }}
        run: |
          go build -trimpath -ldflags "-s -w" \
            -o "dist/keenetic-xray-linux-${{ matrix.goarch }}" \
            ./cmd/keenetic-xray

      # Actually executes the cross-compiled binary under QEMU user-mode
      # emulation (not just a format/vet check) -- installed via apt, not
      # docker/setup-qemu-action, since that action's bundled emulators
      # dropped mips/mipsle support upstream.
      - name: Install QEMU user-mode emulation
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static

      - name: Smoke test under QEMU
        run: ${{ matrix.qemu }} "dist/keenetic-xray-linux-${{ matrix.goarch }}" version

      - name: Build .ipk
        run: |
          case "${{ matrix.goarch }}" in
            arm64) IPK_ARCH=aarch64-3.10 ;;
            mipsle) IPK_ARCH=mipsel-3.4 ;;
          esac
          sh packaging/build-ipk.sh 0.0.0-ci "$IPK_ARCH" \
            "dist/keenetic-xray-linux-${{ matrix.goarch }}" \
            "dist/keenetic-xray_0.0.0-ci_${IPK_ARCH}.ipk"
