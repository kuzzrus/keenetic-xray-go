version: 2

builds:
  - id: keenetic-xray-arm64
    main: ./cmd/keenetic-xray
    binary: keenetic-xray
    goos: [linux]
    goarch: [arm64]
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/kuzzrus/keenetic-xray-go/internal/version.Version={{.Version}}
      - -X github.com/kuzzrus/keenetic-xray-go/internal/version.Commit={{.ShortCommit}}

  - id: keenetic-xray-mipsle
    main: ./cmd/keenetic-xray
    binary: keenetic-xray
    goos: [linux]
    goarch: [mipsle]
    gomips: [softfloat]
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/kuzzrus/keenetic-xray-go/internal/version.Version={{.Version}}
      - -X github.com/kuzzrus/keenetic-xray-go/internal/version.Commit={{.ShortCommit}}

  # keenetic-xray-control-server never runs on a router -- it's the VPS
  # side of bot control -- so it targets ordinary VPS architectures, not
  # the mipsel/aarch64 pair the router binary above cross-compiles for.
  - id: keenetic-xray-control-server-amd64
    main: ./cmd/keenetic-xray-control-server
    binary: keenetic-xray-control-server
    goos: [linux]
    goarch: [amd64]
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/kuzzrus/keenetic-xray-go/internal/version.Version={{.Version}}
      - -X github.com/kuzzrus/keenetic-xray-go/internal/version.Commit={{.ShortCommit}}

  - id: keenetic-xray-control-server-arm64
    main: ./cmd/keenetic-xray-control-server
    binary: keenetic-xray-control-server
    goos: [linux]
    goarch: [arm64]
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/kuzzrus/keenetic-xray-go/internal/version.Version={{.Version}}
      - -X github.com/kuzzrus/keenetic-xray-go/internal/version.Commit={{.ShortCommit}}

archives:
  - formats: [binary]
    name_template: "{{ .Binary }}-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: checksums.txt

# release-please/a human pushing a v* tag owns creating the tag/release;
# goreleaser only attaches build artifacts to it.
#
# REL-01: draft, not published, until release.yml's own later steps
# (UPX-pack, .ipk build, checksums.txt extension) all succeed and
# explicitly undraft it as the very last step. Before this, goreleaser's
# `release --clean` published the release immediately -- a failure in any
# of those later steps left a public release missing its .ipk assets
# (the only thing install.sh actually looks for) with no automatic way
# back short of a human noticing and fixing it. A draft is invisible to
# the GitHub releases page and to the `releases/latest` API install.sh
# queries, so an incomplete run just leaves the previous release as
# "latest" instead.
release:
  mode: append
  draft: true

changelog:
  disable: true
