name: Xray-core build

# Manually-triggered vendored build of the Xray core for the two router
# architectures, so the installer can fetch a known-good, size-optimised
# xray binary from this repo's releases instead of relying on the Entware
# feed having a current xray-core for the arch. Produces, per arch:
#   xray-<tag>-linux-<goarch>          UPX-packed, runs directly
#   xray-<tag>-linux-<goarch>.xz       plain xz of the unpacked binary (fallback if UPX won't exec on a given router)
#   *.sha256                           checksums for both
#   xray-<tag>-linux-<goarch>.provenance.txt
# All uploaded to a release tagged  xray-core/<tag>  (separate from the
# keenetic-xray release line). MPL-2.0 -- redistribution is fine, the
# provenance file records exactly what was built.

on:
  workflow_dispatch:
    inputs:
      xray_version:
        description: "XTLS/Xray-core tag to build (e.g. v26.9.9). May be an upstream pre-release; the pin (packaging/xray-core/version) decides what's the default."
        required: true
        default: v26.9.9
      awg_dev:
        description: "Stage the AmneziaWG patch for a tag that is NOT YET in AWG_CONFIRMED_TAGS below, publishing to xray-core-awg-dev/<tag> for manual real-hardware testing before promotion. Needs packaging/xray-core/amneziawg-<tag>.patch to exist for the chosen tag. Tags already in AWG_CONFIRMED_TAGS always get their patch applied and published to the real xray-core/<tag>, regardless of this flag."
        type: boolean
        required: false
        default: false

env:
  # xray_version tags whose AmneziaWG patch is confirmed working
  # end-to-end on real hardware (see docs/HANDOFF-amneziawg.md) and is
  # now a permanent, unconditional part of vendoring that tag -- applied
  # and published to the real xray-core/<tag> release no matter what
  # awg_dev is set to. Promoting another tag later (e.g. once a
  # v26.3.27 patch is hardware-confirmed) is a one-line append here.
  # Space-separated, matched whole-token in the "resolve" step below.
  AWG_CONFIRMED_TAGS: "v26.9.9"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      apply_patch: ${{ steps.resolve.outputs.apply_patch }}
    steps:
      - name: Resolve AmneziaWG patch/publish target
        id: resolve
        env:
          VER: ${{ inputs.xray_version }}
          AWG_DEV: ${{ inputs.awg_dev }}
        run: |
          set -eu
          is_confirmed=false
          for t in $AWG_CONFIRMED_TAGS; do
            [ "$t" = "$VER" ] && is_confirmed=true
          done
          if [ "$is_confirmed" = "true" ]; then
            apply_patch=true
            tag="xray-core/$VER"
          elif [ "$AWG_DEV" = "true" ]; then
            apply_patch=true
            tag="xray-core-awg-dev/$VER"
          else
            apply_patch=false
            tag="xray-core/$VER"
          fi
          echo "apply_patch=$apply_patch" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
          VER: ${{ inputs.xray_version }}
          APPLY_PATCH: ${{ steps.resolve.outputs.apply_patch }}
        run: |
          set -eu
          if [ "$APPLY_PATCH" = "true" ] && [ "$TAG" = "xray-core-awg-dev/$VER" ]; then
            title="Xray-core $VER + AmneziaWG patch (DEV/TEST — not production)"
            notes="Dev/test build only: upstream Xray-core $VER with the (not yet production-confirmed) AmneziaWG patch from packaging/xray-core/amneziawg-$VER.patch applied. NOT installed by any keenetic-xray release path -- for manual real-hardware verification before this tag is promoted (added to AWG_CONFIRMED_TAGS in .github/workflows/xray-core.yml). Upstream: https://github.com/XTLS/Xray-core/releases/tag/$VER — MPL-2.0."
          elif [ "$APPLY_PATCH" = "true" ]; then
            title="Xray-core $VER (vendored, AmneziaWG support)"
            notes="Vendored Xray-core $VER built for keenetic-xray's router targets, with the AmneziaWG obfuscation patch (packaging/xray-core/amneziawg-$VER.patch) applied -- confirmed working end-to-end on real hardware, see docs/HANDOFF-amneziawg.md. Upstream: https://github.com/XTLS/Xray-core/releases/tag/$VER — MPL-2.0. See each asset's .provenance.txt."
          else
            title="Xray-core $VER (vendored)"
            notes="Vendored Xray-core $VER built for keenetic-xray's router targets. Upstream: https://github.com/XTLS/Xray-core/releases/tag/$VER — MPL-2.0. See each asset's .provenance.txt."
          fi
          # edit (not just create-if-absent): a tag being promoted into
          # AWG_CONFIRMED_TAGS already has a release from its earlier
          # vanilla or dev-staged build, and its title/notes need to
          # reflect what's actually published there now.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$title" --notes "$notes"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --latest=false --title "$title" --notes "$notes"
          fi

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: arm64
            gomips: ""
            upx: "--lzma"
            cross_cc: aarch64-linux-gnu-gcc
            cross_pkg: gcc-aarch64-linux-gnu
          - goarch: mipsle
            gomips: softfloat
            upx: "" # NRV, not LZMA: UPX's LZMA path doesn't cover mips ELF
            cross_cc: ""
            cross_pkg: ""
    steps:
      - name: Checkout Xray-core ${{ inputs.xray_version }}
        uses: actions/checkout@v4
        with:
          repository: XTLS/Xray-core
          ref: ${{ inputs.xray_version }}
          path: xray-core

      - name: Checkout this repo (for the AWG patch file)
        if: ${{ needs.prepare.outputs.apply_patch == 'true' }}
        uses: actions/checkout@v4
        with:
          path: keenetic-xray-go

      - uses: actions/setup-go@v5
        with:
          go-version-file: xray-core/go.mod

      - name: Apply AmneziaWG patch
        if: ${{ needs.prepare.outputs.apply_patch == 'true' }}
        working-directory: xray-core
        env:
          VER: ${{ inputs.xray_version }}
        run: |
          set -eu
          patch="../keenetic-xray-go/packaging/xray-core/amneziawg-${VER}.patch"
          [ -f "$patch" ] || { echo "::error::no AmneziaWG patch for $VER at $patch -- add one before dispatching awg_dev (or confirming) this tag"; exit 1; }
          git apply --verbose "$patch"
          sudo apt-get update -qq
          sudo apt-get install -y -qq protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          gobin="$(go env GOPATH)/bin"
          export PATH="$PATH:$gobin"
          protoc --go_out=. --go_opt=paths=source_relative -I. proxy/wireguard/config.proto
          touched="infra/conf/wireguard.go proxy/tun/tun_freebsd.go proxy/wireguard/bind.go proxy/wireguard/client.go proxy/wireguard/config.pb.go proxy/wireguard/netstack.go proxy/wireguard/server.go proxy/wireguard/tun_default.go proxy/wireguard/tun_linux.go"
          # shellcheck disable=SC2086
          bad="$(gofmt -l $touched)"
          if [ -n "$bad" ]; then echo "::error::gofmt found issues in patched files:"; echo "$bad"; exit 1; fi

      # Dev-staging only (inputs.awg_dev, NOT tied to apply_patch -- a
      # promoted/confirmed tag builds plain CGO_ENABLED=0 like every
      # other production core, see the Build step below), and only
      # where a cross-C toolchain is set up (matrix.cross_cc):
      # CGO_ENABLED=1, using the vendored amneziawg-go fork (see the
      # "Apply AmneziaWG patch" step) as a diagnostic for
      # amnezia-vpn/amneziawg-go#110 ("arm64: outbound H4 header
      # corrupted in transport packets", CGO_ENABLED=0 specifically).
      # Ruled out live as the actual bug (v26.9.9's real root cause was
      # proxy/wireguard/bind.go, see the patch and
      # docs/HANDOFF-amneziawg.md) -- kept only as a free diagnostic for
      # whatever tag is still being staged.
      - name: Install cross-C toolchain (AWG dev CGO diagnostic)
        if: ${{ inputs.awg_dev && matrix.cross_pkg != '' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq "${{ matrix.cross_pkg }}"

      - name: Build
        working-directory: xray-core
        env:
          CGO_ENABLED: ${{ inputs.awg_dev && matrix.cross_cc != '' && '1' || '0' }}
          CC: ${{ matrix.cross_cc }}
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOMIPS: ${{ matrix.gomips }}
          GOFLAGS: -trimpath
        run: |
          set -eu
          ldflags="-s -w -buildid="
          # A CGO build links dynamically against the cross-toolchain's own
          # glibc by default -- meaningless on the router's own Entware
          # libc. Force a fully static link so this stays as portable as
          # the plain CGO_ENABLED=0 builds (same reason this project uses
          # CGO_ENABLED=0 everywhere else).
          if [ "$CGO_ENABLED" = "1" ]; then
            ldflags="$ldflags -linkmode external -extldflags -static"
          fi
          go build -ldflags "$ldflags" -o "$RUNNER_TEMP/xray" ./main

      - name: Package
        env:
          VER: ${{ inputs.xray_version }}
          GOARCH: ${{ matrix.goarch }}
          GOMIPS: ${{ matrix.gomips }}
          UPX_FLAGS: ${{ matrix.upx }}
          CGO_ENABLED: ${{ inputs.awg_dev && matrix.cross_cc != '' && '1' || '0' }}
          CROSS_CC: ${{ matrix.cross_cc }}
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y -qq upx-ucl xz-utils
          cd "$RUNNER_TEMP"

          base="xray-${VER}-linux-${GOARCH}"
          sha_unpacked="$(sha256sum xray | awk '{print $1}')"
          size_unpacked="$(wc -c < xray)"

          # xz fallback: plain compress of the unpacked binary
          xz -9 -e -k -c xray > "${base}.xz"

          # UPX: primary, runs in place
          cp xray "$base"
          # shellcheck disable=SC2086
          upx -9 $UPX_FLAGS "$base"
          upx -t "$base"
          sha_packed="$(sha256sum "$base" | awk '{print $1}')"

          sha256sum "$base" "${base}.xz" > "${base}.sha256"

          go_ver="$(cd "$GITHUB_WORKSPACE/xray-core" && awk '/^go /{print $2; exit}' go.mod)"
          commit="$(cd "$GITHUB_WORKSPACE/xray-core" && git rev-parse HEAD)"
          {
            echo "Xray-core ${VER}"
            echo "upstream:        https://github.com/XTLS/Xray-core/releases/tag/${VER}"
            echo "commit:          ${commit}"
            cc_note=""
            [ "$CGO_ENABLED" = "1" ] && cc_note=" CC=${CROSS_CC} (static)"
            echo "build:           GOOS=linux GOARCH=${GOARCH} GOMIPS=${GOMIPS:-} CGO_ENABLED=${CGO_ENABLED}${cc_note} GOFLAGS=-trimpath"
            echo "ldflags:         -s -w -buildid="
            echo "go:              go.mod declares ${go_ver}; built with $(go version | awk '{print $3}')"
            echo "pack:            $(upx --version | head -n1) -9 ${UPX_FLAGS}"
            echo "size unpacked:   ${size_unpacked}"
            echo "size packed:     $(wc -c < "$base")"
            echo "sha256 unpacked: ${sha_unpacked}"
            echo "sha256 packed:   ${sha_packed}"
            echo "license:         MPL-2.0 — https://github.com/XTLS/Xray-core/blob/${VER}/LICENSE"
          } > "${base}.provenance.txt"

          ls -l "$base" "${base}.xz" "${base}.sha256" "${base}.provenance.txt"

      - name: Smoke test under QEMU
        env:
          VER: ${{ inputs.xray_version }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -eu
          sudo apt-get install -y -qq qemu-user-static
          case "$GOARCH" in
            arm64)  Q=qemu-aarch64-static ;;
            mipsle) Q=qemu-mipsel-static ;;
          esac
          cd "$RUNNER_TEMP"
          echo "== unpacked =="; "$Q" ./xray version
          echo "== packed ==";   "$Q" "./xray-${VER}-linux-${GOARCH}" version

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          BASE: xray-${{ inputs.xray_version }}-linux-${{ matrix.goarch }}
        run: |
          cd "$RUNNER_TEMP"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            "$BASE" "${BASE}.xz" "${BASE}.sha256" "${BASE}.provenance.txt"
